version: '3.8'

services:
  fastapi-ai:
    build: .
    container_name: safefam-ai-server
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      - ENV=local
    # 로컬 개발을 위한 핫 리로드(--reload) 활성화 명령어 주입
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
