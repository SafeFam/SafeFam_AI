services:
  fastapi-ai:
    image: safefam/safefam-ai:${FASTAPI_IMAGE_TAG:?FASTAPI_IMAGE_TAG is required}
    container_name: safefam-ai-server
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.runtime}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    networks:
      - safefam-network

networks:
  safefam-network:
    external: true
