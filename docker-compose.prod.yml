services:
  fastapi-ai:
    image: safefam/safefam-ai:${FASTAPI_IMAGE_TAG:?FASTAPI_IMAGE_TAG is required}
    container_name: safefam-ai-server
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.runtime}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - safefam-network

networks:
  safefam-network:
    external: true
    name: safefam-network
