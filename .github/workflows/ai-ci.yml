name: AI CI/CD

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check dependency compatibility
        run: pip check

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t safefam-ai:test .

  deploy:
    name: Deploy AI to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test
      - docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: ai-production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Send deployment command
        id: send
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          remote_command="sudo -u ${DEPLOY_USER} bash /opt/safefam/SafeFam_AI/scripts/deploy-ai.sh"

          parameters="$(
            jq -cn \
              --arg command "${remote_command}" \
              '{commands: [$command]}'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy SafeFam AI commit ${{ github.sha }}" \
              --timeout-seconds 1800 \
              --parameters "${parameters}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          echo "SSM command sent: ${command_id}"

      - name: Wait for deployment
        id: wait
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          for attempt in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "Attempt ${attempt}/180: ${status:-Pending}"

            case "${status}" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment did not finish within 30 minutes"
          exit 1

      - name: Print deployment result
        if: always() && steps.send.outputs.command_id != ''
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }'